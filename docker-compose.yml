services:
  webapp:
    build:
      context: .
      args:
        # 可选：Go 模块代理。官方 proxy.golang.org 在中国大陆不可达 —— 构建第一步
        # 就是 `go mod download`，会长时间卡在这一层（看着像构建挂了），有时直接失败。
        # 国内构建填 https://goproxy.cn,direct（或 https://mirrors.aliyun.com/goproxy/）。
        # 留空 = 官方默认，行为与上游原版一致。
        GOPROXY: ""
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 管理密钥：留空则用 ./data/admin.key（首次启动随机生成并落盘），
      # 也可在这里显式指定（优先级高于文件）：
      #   WB2API_ADMINKEY: "换成你自己的长随机串"
    ports:
      # v0.31.4 起容器入口是 webapp：网站 / 管理后台 / OpenAI 兼容网关共用 8780。
      # 旧网关（wb2api，7863）仍编译进镜像但不再作为入口，按计划在合并第二步删除。
      - "8780:8780"
    volumes:
      # data 卷 = SQLite（webapp.db + -wal/-shm）+ 管理密钥 + 池状态。
      # ⚠️ 备份要么先停容器，要么三个 db 文件一起复制（见 README「数据库」一节）。
      # 若容器内 app(uid 10001) 报 permission denied，宿主机执行：
      #   chown -R 10001:10001 ./data
      - ./data:/app/data
      # auths 卷仅为**迁移期**保留：把旧网关的账号目录挂进来，用下面的导入命令
      # 一次性搬进 webapp 的 SQLite；搬完即可从本文件删掉这一行。
      #   docker compose exec -it webapp bash -c \
      #     'for f in /app/auths/*.json; do curl -s -X POST http://127.0.0.1:8780/api/admin/accounts/import-desktop \
      #        -H "X-Admin-Key: $(cat /app/data/admin.key)" -H "Content-Type: application/json" \
      #        -d "{\"json\": $(cat $f), \"force\": true}"; done'
      # （expiresAt 是"秒"还是"毫秒"都能吃：见 cmd/webapp/import_desktop.go 的 normalizeExpiresSec）
      - ./auths:/app/auths
      # config.json 不再需要（webapp 用命令行参数 + WB2API_* 环境变量）。
      # 保留挂载仅为了让 login.sh 之类的旧脚本还能读到端口/密钥，可按需删掉。
      - ./config.json:/app/config.json:ro
